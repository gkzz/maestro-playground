name: Screenshot report

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      platform:
        type: string
        required: true
      locale:
        type: string
        required: true
permissions:
  actions: read
  contents: write

concurrency:
  group: screenshot-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download Flutter captures
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          E2E_LOCALE: ${{ inputs.locale }}
        run: |
          artifacts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          download_failed=0
          while IFS= read -r artifact; do
            case "$artifact" in
              maestro-android-unicode|maestro-ios-unicode|maestro-android-unicode-[0-9][0-9]-"$E2E_LOCALE"|maestro-ios-unicode-[0-9][0-9]-"$E2E_LOCALE")
                gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                  --name "$artifact" --dir "$RUNNER_TEMP/captures/$artifact" || download_failed=1
                ;;
            esac
          done <<< "$artifacts"
          exit "$download_failed"

      - name: Set capture locale
        env:
          E2E_LOCALE: ${{ inputs.locale }}
        run: echo "E2E_LOCALE=$E2E_LOCALE" >> "$GITHUB_ENV"

      - name: Publish images and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          E2E_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 -m e2e.screenshot_report.cli \
            --downloads "$RUNNER_TEMP/captures" \
            --output artifacts/screenshot-report \
            --platform "$E2E_PLATFORM" --locale "$E2E_LOCALE" --source-run "$SOURCE_RUN_ID" --publish

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshot-comparison-${{ env.E2E_LOCALE }}
          path: artifacts/screenshot-report
          retention-days: 1
