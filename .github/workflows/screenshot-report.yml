name: Screenshot report

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      platform:
        type: string
        required: true
      locale:
        type: string
        required: true
permissions:
  actions: read
  contents: write

concurrency:
  group: screenshot-reports
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download Flutter captures
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'maestro-*-unicode' --dir "$RUNNER_TEMP/captures"

      - name: Set capture locale
        env:
          E2E_LOCALE: ${{ inputs.locale }}
        run: echo "E2E_LOCALE=$E2E_LOCALE" >> "$GITHUB_ENV"

      - name: Publish images and job summary
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          E2E_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 -m e2e.screenshot_report.cli \
            --downloads "$RUNNER_TEMP/captures" \
            --output artifacts/screenshot-report \
            --platform "$E2E_PLATFORM" --locale "$E2E_LOCALE" --source-run "$SOURCE_RUN_ID" --publish

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-comparison-${{ env.E2E_LOCALE }}
          path: artifacts/screenshot-report
          retention-days: 1
