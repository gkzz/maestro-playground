name: E2E

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "23 20 * * 0" # Monday 05:23 JST
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      android_configuration:
        description: Android OS and locale
        required: true
        default: "Android 17 & ja"
        type: choice
        options:
          - "Android 17 & en"
          - "Android 17 & ja"
          - "Android 16 & en"
          - "Android 16 & ja"
      ios_configuration:
        description: iOS Simulator OS and locale
        required: true
        default: "iOS 27 & ja"
        type: choice
        options:
          - "iOS 27 & en"
          - "iOS 27 & ja"
          - "iOS 26 & ja"
          - "iOS 26 & en"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}${{ inputs.platform != 'ios' && format('-{0}', inputs.android_configuration || 'Android 17 & ja') || '' }}${{ inputs.platform != 'android' && format('-{0}', inputs.ios_configuration || 'iOS 27 & ja') || '' }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Android / ${{ matrix.flow }} / ${{ matrix.os_version }} / ${{ matrix.locale }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_LOCALE: ${{ matrix.locale }}
      ANDROID_VERSION: ${{ matrix.os_version }}
      API_LEVEL: ${{ matrix.os_version == '16' && '36' || '37.0' }}
      TARGET: ${{ matrix.os_version == '16' && 'google_apis' || 'google_apis_ps16k' }}
      COMPILE_SDK: "36"
    strategy:
      fail-fast: false
      matrix:
        os_version: ${{ fromJSON(github.event_name == 'schedule' && '["16","17"]' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.android_configuration, 'Android 16 & ')) && '["16"]' || '["17"]') }}
        locale: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["ja","en"]' || endsWith(inputs.android_configuration, ' & ja') && '["ja"]' || '["en"]') }}
        flow: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["settings","wikipedia","unicode"]' || '["unicode"]') }}

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: ./.github/actions/setup-mise
        with:
          install: "true"

      - name: Setup Java for Flutter build
        if: ${{ matrix.flow == 'unicode' }}
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"

      - name: Install Android CLI
        run: bash setup/android-cli-install.sh

      - name: Setup Android SDK
        env:
          # Only unicode builds the Flutter demo app.
          NDK_VERSION: ${{ matrix.flow == 'unicode' && '28.2.13676358' || '' }}
          ARCH: x86_64
        run: make setup-android-sdk

      - name: Setup Flutter
        if: ${{ matrix.flow == 'unicode' }}
        run: bash setup/flutter-install.sh

      - name: Build Flutter demo app
        if: ${{ matrix.flow == 'unicode' }}
        run: |
          make build-demo-app

      - name: Setup Android Emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_9
          target: ${{ env.TARGET }}
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel on -no-metrics -camera-back emulated

      - name: Write Android local config
        run: |
          mkdir -p local
          {
            echo "ANDROID_EMULATOR_SERIAL=${ANDROID_EMULATOR_SERIAL:-emulator-5554}"
            echo "ADB_SERVER_SOCKET=tcp:127.0.0.1:5037"
          } > local/android.env

      - name: Install test apps
        if: ${{ matrix.flow == 'wikipedia' }}
        run: |
          e2e/download_apps android
          e2e/install_apps android

      - name: Install Flutter demo app
        if: ${{ matrix.flow == 'unicode' }}
        run: make install-android-apps

      - name: Run Maestro on Android
        env:
          E2E_FLOW: ${{ matrix.flow }}
          E2E_REQUIRE_SCREENSHOT_BASELINE: ${{ matrix.flow == 'unicode' && github.event_name != 'workflow_dispatch' }}
        run: |
          e2e/test_android_with_retry

      - name: Shutdown Android Emulator
        if: always()
        run: adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" emu kill || true

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: maestro-android-${{ matrix.flow }}${{ github.event_name != 'workflow_dispatch' && format('-{0}-{1}', matrix.os_version, matrix.locale) || '' }}
          path: artifacts/maestro/android/${{ matrix.flow }}
          retention-days: 1

  test-ios:
    name: iOS / ${{ matrix.flow }} / ${{ matrix.os_version }} / ${{ matrix.locale }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: ${{ matrix.os_version == '26' && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 120
    env:
      E2E_LOCALE: ${{ matrix.locale }}
      IOS_VERSION: ${{ matrix.os_version }}
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
    strategy:
      fail-fast: false
      matrix:
        os_version: ${{ fromJSON(github.event_name == 'schedule' && '["26","27"]' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.ios_configuration, 'iOS 26 & ')) && '["26"]' || '["27"]') }}
        locale: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["ja","en"]' || endsWith(inputs.ios_configuration, ' & ja') && '["ja"]' || '["en"]') }}
        flow: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["settings","wikipedia","unicode"]' || '["unicode"]') }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install tools
        uses: ./.github/actions/setup-mise
        with:
          install: "true"

      - name: Select Xcode 27
        if: ${{ env.IOS_VERSION == '27' }}
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Setup Flutter
        if: ${{ matrix.flow == 'unicode' }}
        run: bash setup/flutter-install.sh

      - name: Build Flutter demo app for iOS Simulator
        if: ${{ matrix.flow == 'unicode' }}
        run: make build-demo-app-ios

      - name: Setup iOS Simulator
        uses: ./.github/actions/setup-ios-simulator
        with:
          runtime-name: ${{ env.IOS_VERSION == '26' && 'iOS 26.2' || 'iOS 27.0' }}
          device-type-name: ${{ env.IOS_VERSION == '26' && 'iPhone 17 Pro' || 'iPhone 18 Pro' }}

      - name: Install test apps
        if: ${{ matrix.flow == 'wikipedia' }}
        run: |
          e2e/download_apps ios
          e2e/install_apps ios

      - name: Install Flutter demo app
        if: ${{ matrix.flow == 'unicode' }}
        run: make install-ios-apps

      - name: Run Maestro on iOS
        env:
          E2E_FLOW: ${{ matrix.flow }}
          E2E_REQUIRE_SCREENSHOT_BASELINE: ${{ matrix.flow == 'unicode' && github.event_name != 'workflow_dispatch' }}
        run: |
          mise run maestro:test-ios

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: maestro-ios-${{ matrix.flow }}${{ github.event_name != 'workflow_dispatch' && format('-{0}-{1}', matrix.os_version, matrix.locale) || '' }}
          path: artifacts/maestro/ios/${{ matrix.flow }}
          retention-days: 1

  # Disabled: reusable workflow calls are not pinned by actions.lock.
