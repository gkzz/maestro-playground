name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Android
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run Maestro on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_7
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -no-metrics -camera-back emulated
          script: |
            maestro --version
            maestro --platform android test .maestro/settings_android.yml --test-output-dir artifacts/maestro/android --debug-output artifacts/maestro/android --flatten-debug-output

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-android
          path: artifacts/maestro/android
          retention-days: 1

  test-ios:
    name: iOS
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Boot Simulator
        run: |
          runtime_name="iOS 26.2"
          device_type_name="iPhone 17 Pro"

          runtime_identifier="$(xcrun simctl list runtimes --json | python3 -c 'import json, sys; data = json.load(sys.stdin); name = sys.argv[1]; matches = [runtime["identifier"] for runtime in data["runtimes"] if runtime.get("name") == name and runtime.get("isAvailable")]; available = ", ".join(runtime.get("name", "") for runtime in data["runtimes"] if runtime.get("isAvailable")); matches or sys.exit(f"Runtime {name!r} is not available. Available runtimes: {available}"); print(matches[-1])' "$runtime_name")"
          device_type_identifier="$(xcrun simctl list devicetypes --json | python3 -c 'import json, sys; data = json.load(sys.stdin); name = sys.argv[1]; matches = [device_type["identifier"] for device_type in data["devicetypes"] if device_type.get("name") == name]; available = ", ".join(device_type.get("name", "") for device_type in data["devicetypes"]); matches or sys.exit(f"Device type {name!r} is not available. Available device types: {available}"); print(matches[-1])' "$device_type_name")"

          echo "Using runtime: $runtime_name ($runtime_identifier)"
          echo "Using device type: $device_type_name ($device_type_identifier)"
          device_id="$(xcrun simctl create "MaestroPlayground-$(uuidgen)" "$device_type_identifier" "$runtime_identifier")"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          echo "SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"

      - name: Run Maestro on iOS
        run: |
          maestro --version
          maestro --platform ios test .maestro/settings_ios.yml --test-output-dir artifacts/maestro/ios --debug-output artifacts/maestro/ios --flatten-debug-output

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-ios
          path: artifacts/maestro/ios
          retention-days: 1
