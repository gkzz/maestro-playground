name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      locale:
        description: Device locale
        required: true
        default: ja
        type: choice
        options:
          - ja
          - en

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}-${{ inputs.locale || 'ja' }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Android / ${{ matrix.flow }}
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_LOCALE: ${{ inputs.locale || 'ja' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: settings
            requires_apps: false
          - flow: wikipedia
            requires_apps: true
          - flow: keyboard
            requires_apps: true

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: ./.github/actions/setup-mise
        with:
          install: "true"

      - name: Setup Android Emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_7
          target: ${{ matrix.flow == 'keyboard' && 'google_apis_playstore' || 'google_apis' }}
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -no-metrics -camera-back emulated

      - name: Write Android local config
        run: |
          mkdir -p local
          {
            echo "ANDROID_EMULATOR_SERIAL=${ANDROID_EMULATOR_SERIAL:-emulator-5554}"
            echo "ADB_SERVER_SOCKET=tcp:127.0.0.1:5037"
          } > local/android.env

      - name: Install test apps
        if: ${{ matrix.requires_apps }}
        run: |
          e2e/download_apps android
          e2e/install_apps android

      - name: Prepare Japanese Gboard
        if: ${{ matrix.flow == 'keyboard' }}
        run: utils/setup/android/japanese-keyboard.sh

      - name: Run Maestro on Android
        env:
          E2E_FLOW: ${{ matrix.flow }}
        run: |
          mise run maestro:test-android

      - name: Collect Android keyboard diagnostics
        if: ${{ always() && matrix.flow == 'keyboard' }}
        run: |
          output_dir=artifacts/maestro/android/keyboard
          mkdir -p "$output_dir"
          adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" shell dumpsys input_method > "$output_dir/input-method.txt" || true
          adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" exec-out screencap -p > "$output_dir/keyboard-final.png" || true
          adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" shell uiautomator dump /sdcard/keyboard.xml || true
          adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" pull /sdcard/keyboard.xml "$output_dir/keyboard.xml" || true

      - name: Shutdown Android Emulator
        if: always()
        run: adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" emu kill || true

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maestro-android-${{ matrix.flow }}
          path: artifacts/maestro/android/${{ matrix.flow }}
          retention-days: 1

  test-ios:
    name: iOS / ${{ matrix.flow }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      E2E_LOCALE: ${{ inputs.locale || 'ja' }}
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: settings
            requires_apps: false
          - flow: wikipedia
            requires_apps: true
          - flow: keyboard
            requires_apps: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: ./.github/actions/setup-mise
        with:
          install: "true"

      - name: Setup iOS Simulator
        env:
          E2E_JAPANESE_KEYBOARD: ${{ matrix.flow == 'keyboard' && '1' || '0' }}
        uses: ./.github/actions/setup-ios-simulator
        with:
          runtime-name: iOS 26.2
          device-type-name: iPhone 17 Pro

      - name: Install test apps
        if: ${{ matrix.requires_apps }}
        run: |
          e2e/download_apps ios
          e2e/install_apps ios

      - name: Run Maestro on iOS
        env:
          E2E_FLOW: ${{ matrix.flow }}
        run: |
          mise run maestro:test-ios

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maestro-ios-${{ matrix.flow }}
          path: artifacts/maestro/ios/${{ matrix.flow }}
          retention-days: 1
