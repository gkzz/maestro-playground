name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  test-android:
    name: Android / ${{ matrix.flow }}
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: settings
            flow_path: .maestro/settings/android.yml
            requires_apps: false
          - flow: wikipedia
            flow_path: .maestro/wikipedia/android.yml
            requires_apps: true

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup Android Emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          api-level: 32
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -no-metrics -camera-back emulated

      - name: Install test apps
        if: ${{ matrix.requires_apps }}
        run: |
          e2e/download_apps android
          e2e/install_apps android

      - name: Run Maestro on Android
        run: |
          maestro --version
          maestro --platform android test "${{ matrix.flow_path }}" --test-output-dir "artifacts/maestro/android/${{ matrix.flow }}" --debug-output "artifacts/maestro/android/${{ matrix.flow }}" --flatten-debug-output

      - name: Shutdown Android Emulator
        if: always()
        run: adb -s "${ANDROID_EMULATOR_SERIAL:-emulator-5554}" emu kill || true

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-android-${{ matrix.flow }}
          path: artifacts/maestro/android/${{ matrix.flow }}
          retention-days: 1

  test-ios:
    name: iOS / ${{ matrix.flow }}
    if: ${{ github.event_name == 'pull_request' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: settings
            flow_path: .maestro/settings/ios.yml
            requires_apps: false
          - flow: wikipedia
            flow_path: .maestro/wikipedia/ios.yml
            requires_apps: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup iOS Simulator
        uses: ./.github/actions/setup-ios-simulator
        with:
          runtime-name: iOS 26.2
          device-type-name: iPhone 17 Pro

      - name: Install test apps
        if: ${{ matrix.requires_apps }}
        run: |
          e2e/download_apps ios
          e2e/install_apps ios

      - name: Run Maestro on iOS
        run: |
          maestro --version
          maestro --platform ios test "${{ matrix.flow_path }}" --test-output-dir "artifacts/maestro/ios/${{ matrix.flow }}" --debug-output "artifacts/maestro/ios/${{ matrix.flow }}" --flatten-debug-output

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: maestro-ios-${{ matrix.flow }}
          path: artifacts/maestro/ios/${{ matrix.flow }}
          retention-days: 1
