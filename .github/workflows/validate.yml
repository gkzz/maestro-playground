name: Validate

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
      - .github/actions/**/*.yml
      - .maestro/**/*.yml
      - e2e/**
      - utils/**
      - default.json
      - mise.toml
      - renovate.json5
  push:
    branches:
      - main
    paths:
      - .github/workflows/*.yml
      - .github/actions/**/*.yml
      - .maestro/**/*.yml
      - e2e/**
      - utils/**
      - default.json
      - mise.toml
      - renovate.json5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow files
        # https://github.com/rhysd/actionlint/blob/v1.7.12/docs/usage.md#use-actionlint-on-github-actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  maestro-check-syntax:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Check Maestro flow syntax
        run: |
          mise run maestro:check-syntax

  shell-check-syntax:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell script syntax
        run: |
          find e2e -type f -perm -111 | sort | while IFS= read -r script; do
            sh -n "$script"
          done
          find utils -type f -perm -111 | sort | while IFS= read -r script; do
            bash -n "$script"
          done

  renovate-validate-config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate config
        uses: docker://ghcr.io/renovatebot/renovate:44.17.1@sha256:90759c92793143ae7db68cd14e690109d8ace3527e17c7d188c96a1ad628282e
        with:
          entrypoint: renovate-config-validator
          args: --no-global renovate.json5
