name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.10.25"
        # mise v2026.10.25 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "3c4d4abd8950e722543aa2ffe58dd9ee84430fc03c8a94d318f64b279229d8ff"
        # mise v2026.10.25 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "4e16dbe5c60f191f6c5f7c2f517c1baf53bc27ccf410de43614fec81b9dfb300"
        # mise v2026.10.25 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "c457464e40a26f81b3b0c1a82b509b51f2306c5794d7ebbadfba57619bb8a949"
        # mise v2026.10.25 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "8a895b4b4161d56f5df7d7d3d9098bc0b1d1e28de400912d0ea49eafe8d59a87"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
