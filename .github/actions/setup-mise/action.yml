name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.5"
        # mise v2026.11.5 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "25c445391850bd7a30f0d2298fe3f7790dbaee4a5c1843b18bd1f27c7b3c892f"
        # mise v2026.11.5 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "bc4db889e66b814c395d2b67dee928a9cde16386edd233232c720fc9afeec19a"
        # mise v2026.11.5 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "2ba757f91479a7f0c7b532843985947a459235c5f6379529edaac253fefb2aab"
        # mise v2026.11.5 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "cdfdf4377a40c242fd3c64e6a706be1b61eb5fd940518edea1c7fbbf9378142b"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
