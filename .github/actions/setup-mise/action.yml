name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.4"
        # mise v2026.11.4 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "afe88f431f5b473c772191b3c4977cdfdd9bc08c71e59275fc913434c4c3d02d"
        # mise v2026.11.4 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "2e58abffce1966c30149ada43307c6e03660b0d9478ec89ee8a00d61c1d09655"
        # mise v2026.11.4 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "17f119ee3a0dceb819834653d686617f25b6788959b23ab3bc8a8c2a9aa746a1"
        # mise v2026.11.4 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "2cfab5f896a4aa1afc87b8b700c7299b3156ba161e8f9c86f1056c5baf7dcaad"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
