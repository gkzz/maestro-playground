name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.10.18"
        # mise v2026.10.18 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "f4fbb6c4d89648f789b8d909e95ae52de941b085f7a8f14bab233dabf406ef02"
        # mise v2026.10.18 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "36866014bde6c3f17e4550833fda0185d6da579967e358059dc9a426f36b3e41"
        # mise v2026.10.18 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "62c9d1c4e7e2757f04b0e4f684953ffe8f2f337d06887c541abdaacf507871f8"
        # mise v2026.10.18 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "02d764f25a03eeec85979409f1b1b5d9fb724acd7903c896ef4c4b9a1b802967"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
