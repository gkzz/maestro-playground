name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.10.14"
        # mise v2026.10.14 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "1c31a411eb1a55327d578e500a121acd21d9948a8a6012a75c68868c44f540ad"
        # mise v2026.10.14 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "d99f8103c7cf1692bc60d190eaad5acb33f56c75032327255f8c14d2db2b5636"
        # mise v2026.10.14 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "c1685f6bc717666a4a48f48d460ae958b66cd409a2b5fcc28a7d32cb5129ad91"
        # mise v2026.10.14 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "86660549ef546a4d491c9f7829112f5f5157d5a41a660ddaab059e6284bf51fe"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
