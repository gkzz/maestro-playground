name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.7"
        # mise v2026.11.7 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "6a8c99bcea83268b335866c0e0ed2f1e82b94c1e5680b6284d63e60db2087307"
        # mise v2026.11.7 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "3fb2619201198f6b07c3bdf5f8762871329bec8bd4e50c0d154d31a61b8116c9"
        # mise v2026.11.7 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "117e6d38831b5bdae5f1430b060fd7b95023973a4395b85e9d32218f57233104"
        # mise v2026.11.7 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "b8f0d460fba603e04c0bfd4332ec334989978b560a5899de1bc614c4715054cb"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
