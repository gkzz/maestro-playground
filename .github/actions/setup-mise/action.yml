name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.8"
        # mise v2026.11.8 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "dfe43dca5b1ae781c39d50458094a5e28b3d4d8a74c52ae5a543f359d9ec2563"
        # mise v2026.11.8 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "41774b303106d591007adeb9fb48b8f7a4054a1dbf992adb1371278d27ef4293"
        # mise v2026.11.8 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "ea45bd5092eb7d298873201951ff47529811c6c743572519acace0ad57e3b9e8"
        # mise v2026.11.8 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "aadde457a974b210b9f977d5a6c36a227e51abbb4bf9db83262defd1f8b7b796"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
