name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.3"
        # mise v2026.11.3 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "04e4a7aef2d68259589ba118f8a73a8be0884c5e3f451ad2eeb4e3b6713c9914"
        # mise v2026.11.3 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "c661208bc2e58e85f10ab75eb2c2193604547ccae7c3a3151fb730cd081a6360"
        # mise v2026.11.3 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "113d5da9ab55f7780e278c7db6843e1ee76fdbd4ec5c18083dfa3731de886cfa"
        # mise v2026.11.3 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "fa49089e8168effd6d612390fc300aea1fd76f2bdd8649d6359650944fe37263"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
