name: Setup mise
description: Install the CI-pinned mise version and optionally install project tools
inputs:
  install:
    description: Install tools declared by the project mise configuration
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_FILE=$GITHUB_WORKSPACE/.config/mise/config.toml" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.10.19"
        # mise v2026.10.19 mise-linux-x64.tar.xz
        MISE_SHA256_LINUX_X64: "6e6435fcca912b5b3979f71f51ca1ded29b1a2ed34085562bad3bdad18121530"
        # mise v2026.10.19 mise-linux-arm64.tar.xz
        MISE_SHA256_LINUX_ARM64: "ba80814e8ca01cfa35dd6e5d60ad8406e09970f631e1ebe3d59663e86c6f6123"
        # mise v2026.10.19 mise-macos-x64.tar.xz
        MISE_SHA256_MACOS_X64: "9c3e297dbf31837d2639e5fcbc7ca0f6c739edd14864c5a7a00992ed638d9c99"
        # mise v2026.10.19 mise-macos-arm64.tar.xz
        MISE_SHA256_MACOS_ARM64: "1d0d916c4988035eef24d5e73964a27fbddc51079053ce399f98bfe7dab52493"

    - name: Install mise tools
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        mise trust --yes "$MISE_CONFIG_FILE"
        mise install --locked maestro
