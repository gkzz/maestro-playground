min_version = "2026.10.19"

[settings]
# 通常のバージョン更新は Renovate の minimumReleaseAge で管理する。
# 手動で latest やメジャー番号から新しいバージョンを選ぶ場合は、
# 以下のコメントアウトを外して、公開後14日間の待機期間を適用する。
# 完全固定したバージョンや mise.lock の既存バージョンには適用されない。
# https://mise.jdx.dev/configuration/settings.html#minimum-release-age
# minimum_release_age = "14d"

[tools]
# バージョンは完全固定し、更新は Renovate で管理するため、
# ツール個別の minimum_release_age は指定しない。
maestro = "cli-2.12.1"

[tasks."maestro:version"]
description = "Print the mise-managed Maestro CLI version."
run = "maestro --version"

[tasks."maestro:check-syntax"]
description = "Check all Maestro flow YAML files."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
find .maestro -name '*.yml' -type f | sort | while IFS= read -r flow; do
  maestro check-syntax "$flow"
done
'''

[tasks."maestro:test-android"]
description = "Run Android Maestro flows. Set E2E_FLOW=settings, wikipedia or unicode to run one flow."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
if [ -f local/android.env ]; then set -a; . local/android.env; set +a; fi
e2e_locale="${E2E_LOCALE:-ja}"
case "$e2e_locale" in en|ja) ;; *) echo "E2E_LOCALE must be one of: en, ja" >&2; exit 1 ;; esac
set -- --platform android
if [ -n "${MAESTRO_HOST:-}" ]; then set -- "$@" --host "$MAESTRO_HOST"; fi
case "${E2E_FLOW:-}" in
  "") output_dir="artifacts/maestro/android"; flow_args=".maestro/settings/android.yml .maestro/wikipedia/android.yml" ;;
  settings|wikipedia|unicode) output_dir="artifacts/maestro/android/$E2E_FLOW"; flow_args=".maestro/$E2E_FLOW/android.yml" ;;
  *) echo "E2E_FLOW must be one of: settings, wikipedia, unicode" >&2; exit 1 ;;
esac
screenshot_baseline="${E2E_SCREENSHOT_BASELINE:-}"
if [ -z "$screenshot_baseline" ] && [ "${E2E_FLOW:-}" = unicode ]; then
  candidate="$PWD/e2e/baselines/android-unicode-field-$e2e_locale.png"
  if [ -f "$candidate" ]; then screenshot_baseline="$candidate"; fi
fi
if [ "${E2E_FLOW:-}" = unicode ]; then
  snapshot="$PWD/$output_dir/android-unicode-field-$e2e_locale-baseline.png"
  mkdir -p "$output_dir"
  if [ -n "$screenshot_baseline" ]; then
    cp "$screenshot_baseline" "$snapshot"
    screenshot_baseline="$snapshot"
    echo present > "$output_dir/android-unicode-field-$e2e_locale-baseline-state.txt"
  else
    echo absent > "$output_dir/android-unicode-field-$e2e_locale-baseline-state.txt"
  fi
fi
maestro --version
maestro "$@" test -e E2E_LOCALE="$e2e_locale" -e SCREENSHOT_BASELINE="$screenshot_baseline" $flow_args --test-output-dir "$output_dir" --debug-output "$output_dir" --flatten-debug-output
'''

[tasks."maestro:test-ios"]
description = "Run iOS Maestro flows. Set E2E_FLOW=settings, wikipedia or unicode to run one flow."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
e2e_locale="${E2E_LOCALE:-ja}"
case "$e2e_locale" in en|ja) ;; *) echo "E2E_LOCALE must be one of: en, ja" >&2; exit 1 ;; esac
case "${E2E_FLOW:-}" in
  "") output_dir="artifacts/maestro/ios"; flow_args=".maestro/settings/ios.yml .maestro/wikipedia/ios.yml" ;;
  settings|wikipedia|unicode) output_dir="artifacts/maestro/ios/$E2E_FLOW"; flow_args=".maestro/$E2E_FLOW/ios.yml" ;;
  *) echo "E2E_FLOW must be one of: settings, wikipedia, unicode" >&2; exit 1 ;;
esac
screenshot_baseline="${E2E_SCREENSHOT_BASELINE:-}"
if [ -z "$screenshot_baseline" ] && [ "${E2E_FLOW:-}" = unicode ]; then
  candidate="$PWD/e2e/baselines/ios-unicode-field-$e2e_locale.png"
  if [ -f "$candidate" ]; then screenshot_baseline="$candidate"; fi
fi
if [ "${E2E_FLOW:-}" = unicode ]; then
  snapshot="$PWD/$output_dir/ios-unicode-field-$e2e_locale-baseline.png"
  mkdir -p "$output_dir"
  if [ -n "$screenshot_baseline" ]; then
    cp "$screenshot_baseline" "$snapshot"
    screenshot_baseline="$snapshot"
    echo present > "$output_dir/ios-unicode-field-$e2e_locale-baseline-state.txt"
  else
    echo absent > "$output_dir/ios-unicode-field-$e2e_locale-baseline-state.txt"
  fi
fi
maestro --version
maestro --platform ios test -e E2E_LOCALE="$e2e_locale" -e SCREENSHOT_BASELINE="$screenshot_baseline" $flow_args --test-output-dir "$output_dir" --debug-output "$output_dir" --flatten-debug-output
'''
