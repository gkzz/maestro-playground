min_version = "2026.8.15"

[settings]
# 公開直後の不具合や不正なリリースを取り込むリスクを減らすため、14日待つ。
# latest やメジャー番号などから新しいバージョンを選ぶ際に適用する。
# 固定バージョンと既存 lockfile のバージョンは除外しない。
# リリース日時を取得できないバージョンには待機期間を適用できない。
# https://mise.jdx.dev/configuration/settings.html#minimum-release-age
minimum_release_age = "14d"
lockfile = true

[tools]
# Renovate のセーフモードではプロジェクトの [settings] が無視されるため、
# 各ツールにも同じ待機期間を指定する。ツールを追加するときも指定すること。
# 通常のバージョン更新は共有 Renovate 設定の minimumReleaseAge でも14日待つ。
# この指定でも固定バージョンや既存 lockfile を再検査するわけではない。
maestro = { version = "cli-2.8.0", minimum_release_age = "14d" }

[tasks."maestro:version"]
description = "Print the mise-managed Maestro CLI version."
run = "maestro --version"

[tasks."maestro:check-syntax"]
description = "Check all Maestro flow YAML files."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
find .maestro -name '*.yml' -type f | sort | while IFS= read -r flow; do
  maestro check-syntax "$flow"
done
'''

[tasks."maestro:test-android"]
description = "Run Android Maestro flows. Set E2E_FLOW=settings or wikipedia to run one flow."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
if [ -f local/android.env ]; then set -a; . local/android.env; set +a; fi
e2e_locale="${E2E_LOCALE:-ja}"
case "$e2e_locale" in en|ja) ;; *) echo "E2E_LOCALE must be one of: en, ja" >&2; exit 1 ;; esac
set -- --platform android
if [ -n "${MAESTRO_HOST:-}" ]; then set -- "$@" --host "$MAESTRO_HOST"; fi
case "${E2E_FLOW:-}" in
  "") output_dir="artifacts/maestro/android"; flow_args=".maestro/settings/android.yml .maestro/wikipedia/android.yml" ;;
  settings|wikipedia) output_dir="artifacts/maestro/android/$E2E_FLOW"; flow_args=".maestro/$E2E_FLOW/android.yml" ;;
  *) echo "E2E_FLOW must be one of: settings, wikipedia" >&2; exit 1 ;;
esac
maestro --version
maestro "$@" test -e E2E_LOCALE="$e2e_locale" $flow_args --test-output-dir "$output_dir" --debug-output "$output_dir" --flatten-debug-output
'''

[tasks."maestro:test-ios"]
description = "Run iOS Maestro flows. Set E2E_FLOW=settings or wikipedia to run one flow."
run = '''
set -eu
cd "${GITHUB_WORKSPACE:-.}"
e2e_locale="${E2E_LOCALE:-ja}"
case "$e2e_locale" in en|ja) ;; *) echo "E2E_LOCALE must be one of: en, ja" >&2; exit 1 ;; esac
case "${E2E_FLOW:-}" in
  "") output_dir="artifacts/maestro/ios"; flow_args=".maestro/settings/ios.yml .maestro/wikipedia/ios.yml" ;;
  settings|wikipedia) output_dir="artifacts/maestro/ios/$E2E_FLOW"; flow_args=".maestro/$E2E_FLOW/ios.yml" ;;
  *) echo "E2E_FLOW must be one of: settings, wikipedia" >&2; exit 1 ;;
esac
maestro --version
maestro --platform ios test -e E2E_LOCALE="$e2e_locale" $flow_args --test-output-dir "$output_dir" --debug-output "$output_dir" --flatten-debug-output
'''
