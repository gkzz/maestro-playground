appId: com.android.settings
tags:
  - android
  - settings
env:
  EXPECTED_TEXT: "${E2E_LOCALE == 'en' ? 'Search settings' : '設定を検索'}"
---
- launchApp
# A freshly booted emulator can show a transient System UI ANR over Settings.
# Recover only this system dialog; keep failures from the Settings app visible.
- runFlow:
    when:
      visible: "${E2E_LOCALE == 'en' ? \"System UI isn't responding\" : '「システム UI」は応答していません'}"
    commands:
      - tapOn:
          id: android:id/aerr_wait
- extendedWaitUntil:
    visible: ${EXPECTED_TEXT}
    timeout: 30000
- assertVisible: ${EXPECTED_TEXT}
- takeScreenshot: android-settings
