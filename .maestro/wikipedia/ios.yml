appId: org.wikimedia.wikipedia
tags:
  - ios
  - wikipedia
env:
  EXPECTED_TEXT: "${E2E_LOCALE == 'en' ? 'The free encyclopedia' : 'フリー百科事典'}"
---
- launchApp
- extendedWaitUntil:
    visible: ${EXPECTED_TEXT}
    timeout: 10000
- assertVisible: ${EXPECTED_TEXT}
- takeScreenshot: ios-wikipedia-${E2E_LOCALE}
- runFlow:
    when:
      true: ${typeof SCREENSHOT_BASELINE !== 'undefined' && SCREENSHOT_BASELINE !== ''}
    commands:
      - assertScreenshot:
          path: ${SCREENSHOT_BASELINE}
          thresholdPercentage: 100
