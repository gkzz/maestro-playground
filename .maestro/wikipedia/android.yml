appId: org.wikipedia
tags:
  - android
  - wikipedia
env:
  EXPECTED_TEXT: "${E2E_LOCALE == 'en' ? \"All the world's knowledge\" : '(?s).*百科事典.*'}"
---
- launchApp
- extendedWaitUntil:
    visible: ${EXPECTED_TEXT}
    timeout: 10000
- assertVisible: ${EXPECTED_TEXT}
- takeScreenshot: android-wikipedia
