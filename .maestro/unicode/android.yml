appId: com.example.example
tags:
  - android
  - unicode
---
- launchApp:
    clearState: true
- tapOn: Input/Keyboard
- tapOn:
    id: textInput
- inputText: 東京
- assertVisible:
    id: textInput
    text: ^東京$
- copyTextFrom:
    id: textInput
- assertTrue: ${maestro.copiedText === "東京"}
# Reopen the saved input with no focus so the blinking caret is not compared.
- tapOn: Save
- stopApp
- launchApp
- tapOn: Input/Keyboard
- assertVisible:
    id: textInput
    text: ^東京$
- takeScreenshot: android-unicode-input-${E2E_LOCALE}
- takeScreenshot:
    path: android-unicode-field-${E2E_LOCALE}
    cropOn:
      id: textInput
- runFlow:
    when:
      true: ${typeof SCREENSHOT_BASELINE !== 'undefined' && SCREENSHOT_BASELINE !== ''}
    commands:
      # Capture a fresh screen for Maestro, separate from the Summary image.
      - stopApp
      - launchApp
      - tapOn: Input/Keyboard
      - assertVisible:
          id: textInput
          text: ^東京$
      - assertScreenshot:
          path: ${SCREENSHOT_BASELINE}
          cropOn:
            id: textInput
          thresholdPercentage: 100
