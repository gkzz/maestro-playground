appId: com.android.settings
tags:
  - android
  - keyboard
---
- runFlow: setup/android.yml
# Settings search is provided by Settings Intelligence on the API 32 image.
- launchApp
- extendedWaitUntil:
    visible: 'Search settings|設定を検索'
    timeout: 10000
- tapOn: 'Search settings|設定を検索'
- tapOn:
    id: 'com.google.android.settings.intelligence:id/search_src_text'
- takeScreenshot: android-keyboard-open
# A fresh Gboard profile starts in English. Switch to the Japanese QWERTY layout.
- runFlow:
    when:
      notVisible: '日本語.*|Japanese.*'
    commands:
      - longPressOn:
          text: 'English.*|英語.*|Space|スペース'
      - tapOn: '日本語.*|Japanese.*'
- assertVisible: '日本語.*|Japanese.*'
- takeScreenshot: android-japanese-keyboard
# Type toukyou using actual software keys; never inject text.
- tapOn:
    text: "t"
    retryTapIfNoChange: false
- tapOn:
    text: "o"
    retryTapIfNoChange: false
- tapOn:
    text: "u"
    retryTapIfNoChange: false
- tapOn:
    text: "k"
    retryTapIfNoChange: false
- tapOn:
    text: "y"
    retryTapIfNoChange: false
- tapOn:
    text: "o"
    retryTapIfNoChange: false
- tapOn:
    text: "u"
    retryTapIfNoChange: false
- assertVisible:
    id: "com.google.android.settings.intelligence:id/search_src_text"
    text: "とうきょう"
- takeScreenshot: android-hiragana
- tapOn:
    text: "東京"
    index: 0
    retryTapIfNoChange: false
- assertVisible:
    id: "com.google.android.settings.intelligence:id/search_src_text"
    text: "東京"
- takeScreenshot: android-kanji
